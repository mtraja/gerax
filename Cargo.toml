[workspace]
resolver = "3"

members = [
    "crates/gerax",
    "crates/gerax-app",

    "crates/gerax-core",
    "crates/gerax-http",
    "crates/gerax-db",

    "crates/gerax-config",
    "crates/gerax-auth",
    "crates/gerax-macros",

    "crates/gerax-actix",
    "crates/gerax-axum",
    "crates/gerax-poem",
     "crates/gerax-salvo",

    "crates/gerax-mongodb",
    "crates/gerax-postgres",
    "crates/gerax-turso",
    "crates/gerax-ai",
    "crates/gerax-mysql",
    "crates/gerax-graphql",
    "crates/gerax-grpc",
    "crates/gerax-capnp",
    "crates/gerax-websocket",
    "crates/gerax-openapi",
    "crates/gerax-codec",
    "crates/gerax-rpc",


    "examples/myapp",
    "examples/app_postgres",
    "examples/app_students",
    "examples/app-mongo",
    "examples/graphql-demo",
    "examples/actix-test",
    "examples/graphql-test",
    "examples/actix-dep-test",
    "examples/graphql-build-test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Marcos Trajano <trajano.assis@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mtraja/gerax"
rust-version = "1.96.1"
publish = true

[workspace.dependencies]

# Fachada
gerax = { path = "crates/gerax" }

# Núcleo
gerax-core = { path = "crates/gerax-core" }
gerax-http = { path = "crates/gerax-http" }
gerax-db = { path = "crates/gerax-db" }

# Framework
gerax-config = { path = "crates/gerax-config" }
gerax-auth = { path = "crates/gerax-auth" }
gerax-macros = { path = "crates/gerax-macros" }

# HTTP
gerax-actix = { path = "crates/gerax-actix" }
gerax-axum = { path = "crates/gerax-axum" }
gerax-poem = { path = "crates/gerax-poem" }
gerax-salvo = { path = "crates/gerax-salvo" }

# Banco de dados
gerax-mongodb = { path = "crates/gerax-mongodb" }
gerax-postgres = { path = "crates/gerax-postgres" }
gerax-turso = { path = "crates/gerax-turso" }

gerax-ai = { path = "crates/gerax-ai" }

gerax-mysql = { path = "crates/gerax-mysql" }

gerax-capnp = { path = "crates/gerax-capnp" }
gerax-websocket = { path = "crates/gerax-websocket" }
gerax-openapi = { path = "crates/gerax-openapi" }
gerax-codec = { path = "crates/gerax-codec" }
gerax-rpc = { path = "crates/gerax-rpc" }

actix-web = { version = "4", features = ["macros"] }
actix-cors = "0.7"
axum = { version = "0.8", features = ["macros"] }
poem = { version = "3" }
async-trait = "0.1.91"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
jsonwebtoken = "9"
dotenv = "0.15"
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.26"
tungstenite = "0.26"
mongodb = "3"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "json", "uuid"] }
bson = { version = "2", features = ["chrono-0_4"] }
tokio = { version = "1", features = ["full"] }

tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-build = "0.14"
mysql_async = "0.31"
serde_urlencoded = "0.7"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
matchit = "0.7"
http = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-attributes = "0.1"
libsql = "0.9"
async-graphql = { version = "7", features = ["chrono"] }
sha2 = "0.10"
hex = "0.4"
prost = "0.14"
prost-types = "0.14"
capnp = "0.27.0"
toml = "0.8"
serde_yml = "0.0.12"
wincode = { version = "0.6", features = ["derive"] }
