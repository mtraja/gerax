# KurrentDB (antigo EventStoreDB) de desenvolvimento para a biblioteca
# `gerax-kurrentdb`.
#
# Uso:
#   docker compose -f compose-kurrentdb.yaml up -d
#   (ou: podman-compose -f compose-kurrentdb.yaml up -d)
#
# - gRPC/HTTP : localhost:2113
# - UI (admin/changeit): http://localhost:2113
#
# Apenas para desenvolvimento local — nunca para produção (§39).
services:
  kurrentdb:
    image: docker.io/kurrentdb/kurrentdb:latest
    container_name: gerax-kurrentdb
    ports:
      - "2113:2113"
    environment:
      KURRENTDB_RUN_PROJECTIONS: All
      KURRENTDB_START_STANDARD_PROJECTIONS: "true"
      KURRENTDB_INSECURE: "true"
      KURRENTDB_CLUSTER_SIZE: "1"
      KURRENTDB_MEM_DB: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:2113/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
