[package]
name = "gerax"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

description = "Framework Gerax"

[dependencies]
gerax-core.workspace = true
gerax-macros.workspace = true

gerax-http = { workspace = true, optional = true }

gerax-actix = { workspace = true, optional = true }
gerax-axum = { workspace = true, optional = true }
gerax-poem = { workspace = true, optional = true }

gerax-mongodb = { workspace = true, optional = true }
gerax-postgres = { workspace = true, optional = true }

gerax-auth = { workspace = true, optional = true }
gerax-config = { workspace = true, optional = true }

[features]
default = ["actix", "mongodb"]

actix = ["dep:gerax-http", "dep:gerax-actix"]
axum = ["dep:gerax-http", "dep:gerax-axum"]
poem = ["dep:gerax-http", "dep:gerax-poem"]

mongodb = ["dep:gerax-mongodb"]

postgres = ["dep:gerax-postgres"]

auth = ["dep:gerax-auth"]
config = ["dep:gerax-config"]