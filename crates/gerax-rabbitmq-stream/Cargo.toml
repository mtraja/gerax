[package]
name = "gerax-rabbitmq-stream"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

description = "Adapter RabbitMQ Streams para o gerax-eda (rabbitmq-stream-client)"

[dependencies]
gerax-eda.workspace = true
rabbitmq-stream-client = "0.11"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
